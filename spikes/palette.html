<!doctype html>
<meta charset="utf-8">
<title>Palette directions - idempotency4j</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Spike only. Typeface is still OPEN (O4) - system stack deliberately, so the
     comparison is about colour and nothing else. */
  :root {
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: #000; }

  /* ---------- A. Instrument ---------- */
  .p-a {
    --ink-0:#0a0c11; --ink-1:#10131a; --ink-2:#171b24;
    --rule:#242a36; --rule-hi:#3a4351;
    --dim:#7c8798;  --text:#c3cad6;  --text-hi:#f2f5f9;
    --signal:#3ddbd9; --signal-hi:#82f0ee; --on-signal:#04141a;
  }
  /* ---------- B. Phosphor ---------- */
  .p-b {
    --ink-0:#0a0d0f; --ink-1:#111518; --ink-2:#181d21;
    --rule:#232a2e; --rule-hi:#39434a;
    --dim:#7d8a90;  --text:#c2cbd0;  --text-hi:#f1f5f6;
    --signal:#6ee787; --signal-hi:#a2f2b2; --on-signal:#05170c;
  }
  /* ---------- C. Blueprint (luminance only, no hue) ---------- */
  .p-c {
    --ink-0:#090b0f; --ink-1:#0f1116; --ink-2:#15181f;
    --rule:#22262f; --rule-hi:#363c49;
    --dim:#6e7686;  --text:#a9b1c0;  --text-hi:#ffffff;
    --signal:#ffffff; --signal-hi:#ffffff; --on-signal:#090b0f;
  }
  /* ---------- D. Sodium ---------- */
  .p-d {
    --ink-0:#0a0b0e; --ink-1:#101217; --ink-2:#171a20;
    --rule:#242832; --rule-hi:#3a404d;
    --dim:#7f8695;  --text:#c5c9d3;  --text-hi:#f5f6f9;
    --signal:#f0a83c; --signal-hi:#ffc06a; --on-signal:#1a1003;
  }


  /* ---------- E. Ice ---------- */
  .p-e {
    --ink-0:#090b10; --ink-1:#0f1219; --ink-2:#161a23;
    --rule:#232833; --rule-hi:#39414f;
    --dim:#78829a;  --text:#c0c6d6;  --text-hi:#f1f4fa;
    --signal:#7aa2f7; --signal-hi:#a6c0fa; --on-signal:#060b18;
  }
  /* ---------- F. Spectrum ---------- */
  .p-f {
    --ink-0:#0a0a0f; --ink-1:#101017; --ink-2:#17171f;
    --rule:#26262f; --rule-hi:#3c3c49;
    --dim:#82808f;  --text:#c6c4d0;  --text-hi:#f4f3f8;
    --signal:#f062a8; --signal-hi:#f894c4; --on-signal:#1a0512;
  }

  .panel { background: var(--ink-0); color: var(--text); padding: 40px 0 48px; }
  .wrap  { max-width: 1180px; margin: 0 auto; padding: 0 48px; }

  /* marker strip so each direction is identifiable in the contact sheet */
  .marker { font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--dim); padding: 0 48px 24px;
            max-width: 1180px; margin: 0 auto; }
  .marker b { color: var(--text-hi); font-weight: 600; }
  .marker i { font-style: normal; color: var(--signal); }

  /* --- chrome --- */
  .nav { display: flex; align-items: center; justify-content: space-between;
         border-bottom: 1px solid var(--rule); padding-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { height: 22px; width: auto; display: block; }
  .brand span { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; color: var(--text-hi); }
  .nav ul { display: flex; gap: 24px; list-style: none; margin: 0; padding: 0;
            font-family: var(--mono); font-size: 11px; font-weight: 600;
            letter-spacing: .08em; text-transform: uppercase; }
  .nav a { color: var(--dim); text-decoration: none; }

  /* --- hero --- */
  .hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 64px; padding: 48px 0 0; align-items: start; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
             text-transform: uppercase; color: var(--dim); margin: 0 0 16px; }
  h1 { font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 20px;
       color: var(--text-hi); font-weight: 600; max-width: 18ch; }
  .sub { font-size: 16px; line-height: 1.55; margin: 0 0 32px; max-width: 48ch; }
  .actions { display: flex; align-items: center; gap: 24px; }
  .btn { background: var(--signal); color: var(--on-signal); font: 600 13px/1 var(--sans);
         padding: 12px 20px; border: 0; border-radius: 2px; cursor: pointer; letter-spacing: .01em; }
  .lnk { color: var(--text); font-size: 13px; text-decoration: underline;
         text-decoration-color: var(--rule-hi); text-underline-offset: 4px; }

  /* coordinate block */
  .coord { border: 1px solid var(--rule); background: var(--ink-1); }
  .coord-head { display: flex; justify-content: space-between; align-items: center;
                border-bottom: 1px solid var(--rule); padding: 10px 14px;
                font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
                text-transform: uppercase; color: var(--dim); }
  .coord-head button { background: none; border: 0; color: var(--text); cursor: pointer;
                       font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
                       text-transform: uppercase; }
  .coord pre { margin: 0; padding: 14px; font-family: var(--mono); font-size: 12px;
               line-height: 1.6; color: var(--text); overflow-x: auto; }
  .coord .k { color: var(--dim); }

  /* --- figure --- */
  .fig { margin: 56px 0 0; border-top: 1px solid var(--rule); padding-top: 24px; }
  .fig-cap { font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
             color: var(--dim); margin: 0 0 20px; }
  .fig-cap b { color: var(--text-hi); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .fig svg { width: 100%; height: auto; display: block; background: var(--ink-1);
             border: 1px solid var(--rule); }

  /* --- code line --- */
  .codeline { margin: 32px 0 0; border: 1px solid var(--rule); background: var(--ink-1);
              padding: 14px 16px; font-family: var(--mono); font-size: 13px; color: var(--text); }
  .codeline .ann { color: var(--text-hi); }
  .codeline .str { color: var(--dim); }

  /* --- integrations --- */
  .mods { margin: 32px 0 0; display: grid; grid-template-columns: repeat(4, 1fr);
          border: 1px solid var(--rule); }
  .mod { padding: 18px 16px; border-right: 1px solid var(--rule); }
  .mod:last-child { border-right: 0; }
  .mod code { font-family: var(--mono); font-size: 12px; color: var(--text-hi); display: block; margin-bottom: 6px; }
  .mod small { font-size: 11px; color: var(--dim); }
  .mod.on { background: var(--signal); }
  .mod.on code, .mod.on small { color: var(--on-signal); }
</style>

<template id="frag">
  <div class="wrap">
    <nav class="nav">
      <div class="brand">
        <svg viewBox="0 6 46 36" aria-hidden="true">
          <g fill="none" stroke="var(--text-hi)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 12 L18 24 L6 36"/><path d="M18 12 L30 24 L18 36"/>
          </g>
          <rect x="35" y="10" width="5" height="28" rx="2.5" fill="var(--signal)"/>
        </svg>
        <span>idempotency4j</span>
      </div>
      <ul>
        <li><a href="#">Docs</a></li>
        <li><a href="#">Learn</a></li>
        <li><a href="#">GitHub</a></li>
      </ul>
    </nav>

    <div class="hero">
      <div>
        <p class="eyebrow">// Idempotency for Java</p>
        <h1>Prevent duplicate side effects when your systems retry</h1>
        <p class="sub">Give a unit of work a key: it runs once, and every duplicate gets
          the stored result back.</p>
        <div class="actions">
          <button class="btn">Get started</button>
          <a class="lnk" href="#">Read the limitations</a>
        </div>
      </div>
      <div class="coord">
        <div class="coord-head"><span>pom.xml</span><button>Copy</button></div>
<pre><span class="k">&lt;dependency&gt;</span>
  &lt;groupId&gt;dev.idempotency4j&lt;/groupId&gt;
  &lt;artifactId&gt;idempotency-spring-boot-starter&lt;/artifactId&gt;
  &lt;version&gt;0.4.0&lt;/version&gt;
<span class="k">&lt;/dependency&gt;</span></pre>
      </div>
    </div>

    <div class="fig">
      <p class="fig-cap"><b>Fig. 1</b> &nbsp; Two charges, or one - the same request, sent twice</p>
      <svg viewBox="0 0 1080 200" role="img"
           aria-label="Two request attempts across four lanes. The first attempt times out after charging the payment provider. The second attempt hits the stored record and replays it, so the provider is never called again: one charge.">
        <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
          <!-- lane labels -->
          <g fill="var(--dim)">
            <text x="24" y="44">Client</text>
            <text x="24" y="84">Server</text>
            <text x="24" y="124">Store</text>
            <text x="24" y="164">Payments</text>
          </g>
          <!-- lane axis -->
          <line x1="110" y1="16" x2="110" y2="184" stroke="var(--rule-hi)" stroke-width="1"/>
          <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4">
            <line x1="110" y1="40" x2="1056" y2="40"/>
            <line x1="110" y1="80" x2="1056" y2="80"/>
            <line x1="110" y1="120" x2="1056" y2="120"/>
            <line x1="110" y1="160" x2="1056" y2="160"/>
          </g>

          <!-- attempt 1 -->
          <text x="130" y="26" fill="var(--dim)">attempt 1</text>
          <g fill="none" stroke="var(--text)" stroke-width="1">
            <rect x="130" y="33" width="96" height="14"/>
            <rect x="238" y="73" width="248" height="14"/>
            <rect x="262" y="113" width="200" height="14"/>
            <rect x="300" y="153" width="132" height="14"/>
          </g>
          <g fill="var(--text)">
            <text x="272" y="124" font-size="10">IN_PROGRESS</text>
            <text x="312" y="164" font-size="10">charge</text>
          </g>
          <!-- timeout -->
          <g stroke="var(--rule-hi)" stroke-width="1" stroke-dasharray="3 3">
            <line x1="498" y1="40" x2="498" y2="184"/>
          </g>
          <text x="508" y="44" fill="var(--dim)" font-size="10">timeout</text>

          <!-- attempt 2 -->
          <text x="586" y="26" fill="var(--dim)">attempt 2 - the retry</text>
          <g fill="none" stroke="var(--text)" stroke-width="1">
            <rect x="586" y="33" width="96" height="14"/>
            <rect x="694" y="73" width="180" height="14"/>
          </g>
          <!-- the idempotent path: the only accent in the frame -->
          <g>
            <rect x="718" y="113" width="132" height="14" fill="var(--signal)"/>
            <text x="726" y="124" font-size="10" fill="var(--on-signal)">COMPLETE</text>
            <text x="886" y="84" font-size="10" fill="var(--signal)">Outcome.Replayed</text>
          </g>
          <!-- payments lane stays empty, and that is the point -->
          <text x="718" y="164" font-size="10" fill="var(--dim)">not called</text>

          <!-- tally -->
          <text x="962" y="164" font-size="11" fill="var(--signal)" text-anchor="end">1 charge</text>
        </g>
      </svg>
    </div>

    <div class="codeline">
      <span class="ann">@Idempotent</span>(key = <span class="str">"#order.id"</span>, scope = <span class="str">"orders"</span>, ttl = <span class="str">"PT30S"</span>)
    </div>

    <div class="mods">
      <div class="mod on"><code>idempotency-spring</code><small>@Idempotent, AOP, transactions</small></div>
      <div class="mod"><code>idempotency-spring-web</code><small>Servlet capture and replay</small></div>
      <div class="mod"><code>idempotency-jdbc</code><small>PostgreSQL, MySQL, H2</small></div>
      <div class="mod"><code>idempotency-redis</code><small>Lettuce, standalone and Sentinel</small></div>
    </div>
  </div>
</template>

<div id="out"></div>
<script>
  const DIRECTIONS = [
    ['a', 'A. Instrument', 'cool near-black + cyan-teal', '#3ddbd9'],
    ['b', 'B. Phosphor',   'cool near-black + signal green', '#6ee787'],
    ['c', 'C. Blueprint',  'no hue at all - the accent is pure luminance', '#ffffff'],
    ['d', 'D. Sodium',     'cool near-black + amber', '#f0a83c'],
    ['e', 'E. Ice',        'cool near-black + ice blue', '#7aa2f7'],
    ['f', 'F. Spectrum',   'cool near-black + cold magenta', '#f062a8'],
  ];
  const tpl = document.getElementById('frag');
  const out = document.getElementById('out');
  for (const [key, name, note, hex] of DIRECTIONS) {
    const section = document.createElement('section');
    section.className = 'panel p-' + key;
    const marker = document.createElement('div');
    marker.className = 'marker';
    marker.innerHTML = '<b>' + name + '</b> &nbsp;&middot;&nbsp; ' + note + ' &nbsp;&middot;&nbsp; <i>' + hex + '</i>';
    section.appendChild(marker);
    section.appendChild(tpl.content.cloneNode(true));
    out.appendChild(section);
  }
</script>
