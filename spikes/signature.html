<title>Signature feasibility - Two charges, or one</title>
<style>
  /* Phase 2 feasibility test (docs/CONTENT.md; MOTION.md "Feasibility test").
     Both static frames of the signature scene, both themes, no motion.
     Gate: each frame is comprehensible alone with no caption beyond its mono
     labels, and the 390 version is legible without zooming.
     The typeface is OPEN until phase 6b, so this uses the system mono stack -
     the test is the composition, not the face. */
  [data-theme="dark"] {
    --ink-0: #0a0c11; --rule: #242a36; --rule-hi: #566275;
    --dim: #7c8798; --text: #c3cad6; --text-hi: #f2f5f9; --signal: #3ddbd9;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --ink-0: #f7f8fa; --rule: #d3d8e0; --rule-hi: #7f8998;
    --dim: #5c6675; --text: #2a3038; --text-hi: #0d1117; --signal: #0d7373;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0c11; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .theme { background: var(--ink-0); padding: 48px 48px 64px; }
  .chrome { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
            margin: 0 0 16px; border-top: 1px solid var(--rule); padding-top: 12px; }
  .frame { margin: 0 0 64px; }
  .frame:last-child { margin-bottom: 0; }
  .scene { display: block; width: 100%; height: auto; max-width: 1440px; margin: 0 auto; }
  .mobile-only { display: none; max-width: 342px; }
  /* Below 1024 the horizontal scene would scale to 0.56 and its 13px mono
     labels to 7px, so the stacked layout takes over well above 390. */
  @media (max-width: 1023px) {
    .theme { padding: 24px 24px 40px; }
    .desktop-only { display: none; }
    .mobile-only { display: block; }
  }
</style>
